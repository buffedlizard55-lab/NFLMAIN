name: Tests

on:
  push:
    branches: ['**']
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'docs/assets/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'docs/assets/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pipeline tests + offline build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest PyYAML

      - name: Run unit tests
        run: python3 -m pytest tests -q

      - name: Prove the pipeline builds end-to-end from fixtures (no network)
        run: |
          rm -rf /tmp/offline-build
          python3 pipeline/build_site_data.py \
            --offline tests/fixtures \
            --out /tmp/offline-build \
            --report /tmp/offline-build/report.md
          test -f /tmp/offline-build/manifest.json
          test -f /tmp/offline-build/scoreboard.json
          test -f /tmp/offline-build/teams.json
          echo "Offline build produced:"
          find /tmp/offline-build -type f | sort

      - name: Prove the live build works against the real feeds
        # This is the check that matters: it exercises the actual network path against
        # nflverse/nfl.com data, not fixtures. It writes to /tmp so it cannot pollute the
        # repository, and it asserts that real games and real plays came back.
        run: |
          rm -rf /tmp/live-build
          python3 pipeline/build_site_data.py --out /tmp/live-build --report /tmp/live-build/report.md
          python3 - <<'PY'
          import json, sys
          m = json.load(open('/tmp/live-build/manifest.json'))
          cov = m['coverage']
          print(json.dumps(cov, indent=2))
          problems = []
          if cov['season_count'] < 20:
              problems.append(f"only {cov['season_count']} seasons - expected >= 20")
          if cov['game_count'] < 5000:
              problems.append(f"only {cov['game_count']} games - expected >= 5000")
          if cov['plays'] < 1000:
              problems.append(f"only {cov['plays']} plays - expected >= 1000")
          for d in m['downloads']:
              if d.get('mode') == 'fixture':
                  problems.append(f"live build used a fixture: {d.get('url')}")
          if problems:
              print("::error::Live build assertions failed:")
              for p in problems:
                  print("  - " + p)
              sys.exit(1)
          print("LIVE BUILD OK")
          PY

      - name: Prove the direct nfl.com reader works against the live site
        # The charter asks for data straight from the NFL. This is the step that proves
        # the no-credentials reader really does read nfl.com, on every CI run, against
        # the live site - and that what it reads agrees with the data we just built.
        # If nfl.com changes its markup, this is where it is caught, not in production.
        run: |
          WEEK=$(python3 -c "
          import json
          m = json.load(open('/tmp/live-build/manifest.json'))
          c = m['current']
          print(c['season'], c['season_type'], c['week'])
          ")
          set -- $WEEK
          echo "Checking official nfl.com read for season=$1 type=$2 week=$3"
          python3 pipeline/nfl_direct.py --diagnose \
            --season "$1" --type "$2" --week "$3" --dump-chars 4000

      - name: Diff the official nfl.com read against the published build
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'pipeline')
          from nfl_direct import fetch_week, crosscheck_week

          m = json.load(open('/tmp/live-build/manifest.json'))
          cur = m['current']
          season = json.load(open(f"/tmp/live-build/seasons/{cur['season']}.json"))
          ours = [g for g in season['games']
                  if g.get('week') == cur['week'] and g.get('season_type') == cur['season_type']]

          official = fetch_week(cur['season'], cur['season_type'], cur['week'])
          print("nfl.com read:", official['http_status'], official['bytes'], "bytes,",
                len(official['games']), "games; parse:", official['parse'])

          if not official['ok']:
              print("::error::The direct nfl.com reader returned no games.")
              print("error:", official['error'])
              sys.exit(1)

          check = crosscheck_week(official, ours)
          print(json.dumps({k: v for k, v in check.items() if k != 'rows'}, indent=2))

          problems = []
          # A score disagreement between nfl.com and the published data is a real finding:
          # fail loudly so a human looks at it rather than shipping it.
          if check['mismatched']:
              problems.append(f"nfl.com disagrees with {check['mismatched']} published score(s)")
          # A club name nfl.com printed that we cannot resolve means the label was read
          # wrong (this is how "Watch Replay, Falcons" was caught) or a club was renamed.
          if check['unrecognised_club_names']:
              problems.append(
                  f"{check['unrecognised_club_names']} club name(s) nfl.com printed could "
                  f"not be resolved to an abbreviation")
          # The reader must have actually looked at something, or it proved nothing.
          if check['comparable'] < 1 and check['official_no_score'] < 1:
              problems.append("nothing was compared; the check proved nothing")
          # Degenerate readings are a parse failure, not a quiet success.
          if official['parse'].get('games_parsed', 0) < 1:
              problems.append("the reader parsed no games at all")
          # If every game came from the weakest strategy, the label parse has regressed.
          if official['parse'].get('markup_heuristic_used', 0) and \
                  not official['parse'].get('aria_labels_seen', 0):
              problems.append("no accessible label was read; only markup guessing was used")

          for row in check['rows']:
              print("  ", row)
          if problems:
              print("::error::Direct nfl.com read failed its checks:")
              for p in problems:
                  print("  - " + p)
              sys.exit(1)
          print("DIRECT NFL READ OK")
          PY

      - name: JavaScript syntax check
        run: |
          for f in docs/assets/js/*.js; do
            node --check "$f" && echo "ok: $f"
          done

      - name: Upload offline build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-build
          path: /tmp/offline-build
          if-no-files-found: warn
          retention-days: 7
